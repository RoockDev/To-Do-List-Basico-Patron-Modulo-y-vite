<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-do List</title>
</head>
<body>
  <div class="container">
    <h1>Lista de Tareas</h1>
    <form id="taskForm">
      <div>
        <label for="taskInput">Añadir Tarea</label>
        <input type="text" id="taskInput" placeholder="Escriba la tarea">
      </div>
      <button type="submit">Añadir</button>
    </form>

    <ul id="taskList"></ul>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
